[project]
name = "cleanroom"
version = "0.1.0"
description = "Tyre degradation deconfounding for F1 practice sessions"
requires-python = ">=3.11"
dependencies = [
  "fastf1>=3.4",
  "httpx",
  "tenacity",
  "pandas",
  "pyarrow",
  "duckdb",
  "pandera",
  "numpy",
  "scipy",
  "statsmodels",
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pyyaml",
]

[project.optional-dependencies]
# numpyro/jax/lightgbm enter at Phase 4/5 (docs/SPEC.md section 8); kept out of the
# base install so Phase 0 environments resolve quickly on any Python >= 3.11.
model = ["numpyro", "jax", "lightgbm", "anthropic"]
dev = ["pytest", "hypothesis", "ruff", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleanroom"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
